<svg xmlns="http://www.w3.org/2000/svg" width="360" height="120" viewBox="0 0 360 120" role="img" aria-labelledby="t d">
  <title id="t">benchdiff spike: theme-aware card</title>
  <desc id="d">Transparent background; text and bar colours switch with prefers-color-scheme.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .fg { fill: #1f2328; font: 14px sans-serif; }
    .bar { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .fg { fill: #e6edf3; }
      .bar { fill: #3fb950; }
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="359" height="119" rx="8"/>
  <text class="fg" x="16" y="30">spike: prefers-color-scheme card</text>
  <text class="fg" x="16" y="62">BenchmarkSort</text>
  <rect class="bar" x="130" y="50" width="180" height="16"/>
  <text class="fg" x="16" y="98">dark theme = dark card if honoured</text>
</svg>
