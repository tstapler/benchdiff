name: Release benchmarks

# Reusable workflow: run a repo's benchmarks, attach `benchmarks.json` to a release, and diff
# against the previous release's asset. Call it from `on: release: types: [published]`:
#
#   jobs:
#     bench:
#       permissions: { contents: write }
#       uses: tstapler/benchdiff/.github/workflows/release-benchmarks.yml@v0
#       with:
#         bench-command: go test -bench . -benchmem -count=10 ./... | tee bench.txt
#         results: bench.txt
#         format: go
#         benchdiff-ref: <full commit SHA of tstapler/benchdiff>
#
# Pin both the `uses:` ref and `benchdiff-ref` to a commit SHA. `setup` and `bench-command` run
# verbatim in the shell: never build them from `github.event.*` or other attacker-influenced data.

on:
  workflow_call:
    inputs:
      bench-command:
        description: Shell command that runs the benchmarks and writes the file named by `results`.
        type: string
        required: true
      results:
        description: File (or glob) the benchmarks produce.
        type: string
        required: true
      format:
        description: benchdiff input format.
        type: string
        default: auto
      setup:
        description: Optional shell command run before the benchmarks (install toolchains, build, ...).
        type: string
        default: ''
      asset-name:
        description: Release asset name for the canonical results.
        type: string
        default: benchmarks.json
      threshold:
        type: string
        default: '5'
      runs-on:
        type: string
        default: ubuntu-latest
      benchdiff-ref:
        description: Ref of tstapler/benchdiff to run; pin a full commit SHA.
        type: string
        required: true

permissions:
  contents: write

jobs:
  benchmarks:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name }}
      ASSET: ${{ inputs.asset-name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: tstapler/benchdiff
          ref: ${{ inputs.benchdiff-ref }}
          path: .benchdiff-action
      - name: Setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - name: Run benchmarks
        run: ${{ inputs.bench-command }}
      - name: Find the previous release's results
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest non-draft, non-prerelease published before this one; the current tag is excluded
          # by its own publishedAt so a re-run of an older release diffs against its true predecessor.
          cur="$(gh release view "$TAG" --json publishedAt --jq .publishedAt)"
          prev="$(gh release list --exclude-drafts --limit 50 --json tagName,publishedAt,isPrerelease \
            | jq -r --arg tag "$TAG" --arg cur "$cur" \
              '[.[] | select(.tagName != $tag and (.isPrerelease | not) and .publishedAt < $cur)]
               | sort_by(.publishedAt) | reverse | .[0].tagName // empty')"
          if [ -z "$prev" ]; then
            echo "No previous release; reporting head only."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/prev"
          if ! err="$(gh release download "$prev" --pattern "$ASSET" --dir "$RUNNER_TEMP/prev" 2>&1)"; then
            case "$err" in
              *"no assets match"*) echo "Release $prev has no asset $ASSET; reporting head only."; exit 0 ;;
              *) echo "$err" >&2; exit 1 ;;
            esac
          fi
          echo "base=$RUNNER_TEMP/prev/$ASSET" >> "$GITHUB_OUTPUT"
          echo "previous=$prev" >> "$GITHUB_OUTPUT"
      - name: Diff
        id: diff
        uses: ./.benchdiff-action
        with:
          head: ${{ inputs.results }}
          base: ${{ steps.previous.outputs.base }}
          format: ${{ inputs.format }}
          base-format: benchdiff   # the previous release's asset is canonical JSON
          threshold: ${{ inputs.threshold }}
          title: Benchmarks ${{ steps.previous.outputs.previous && format('{0} → {1}', steps.previous.outputs.previous, github.event.release.tag_name) || github.event.release.tag_name }}
          tag: release
          comment: 'false'
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_JSON: ${{ steps.diff.outputs.head-json-path }}
          REPORT_MD: ${{ steps.diff.outputs.report-path }}
        run: |
          cp "$HEAD_JSON" "$ASSET"
          cp "$REPORT_MD" benchmark-diff.md
          gh release upload "$TAG" "$ASSET" benchmark-diff.md --clobber
